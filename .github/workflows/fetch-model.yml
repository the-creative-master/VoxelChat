name: Fetch SmolLM2 model

# The model weights (1.1 GB) do not live in git – GitHub refuses files above
# 100 MB. This workflow fetches SmolLM2 1.7B from Hugging Face on a GitHub
# runner, checks its checksum and publishes it two ways:
#
#   1. as chunks on a temporary branch -> a transport that lets a sandbox with
#      a restricted network pull the very same bytes down
#   2. as a release asset  -> the URL VoxelChat downloads from (no Hugging Face
#      needed at runtime, resumable, checksum verified)
#
# The temporary branch is deleted once the release asset exists.

on:
    push:
        branches: [arena/108466d4-voxelchat]
        paths: [".github/workflows/fetch-model.yml"]
    workflow_dispatch: {}

permissions:
    contents: write
    issues: write

env:
    MODEL_NAME: smollm2-1.7b-instruct-q4_k_m.gguf
    MODEL_URL: https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF/resolve/2d4a76a30b4af41ecd395c35725ac11688d4cfe4/smollm2-1.7b-instruct-q4_k_m.gguf
    MODEL_SHA256: decd2598bc2c8ed08c19adc3c8fdd461ee19ed5708679d1c54ef54a5a30d4f33
    RELEASE_TAG: smollm2-1.7b-instruct-q4_k_m

jobs:
    fetch:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Download SmolLM2 1.7B Instruct (Q4_K_M)
              run: |
                  set -euo pipefail
                  echo "Downloading $MODEL_NAME ..."
                  curl -L --fail --retry 3 --retry-delay 5 -C - -o "$MODEL_NAME" "$MODEL_URL"
                  ls -lh "$MODEL_NAME"

            - name: Verify checksum
              run: |
                  set -euo pipefail
                  echo "$MODEL_SHA256  $MODEL_NAME" | sha256sum -c -

            - name: Split into chunks
              run: |
                  set -uo pipefail
                  rm -rf chunks
                  mkdir -p chunks
                  split -b 90M -d -a 2 "$MODEL_NAME" chunks/part-
                  ls -l chunks | sed 's/^/    /'
                  echo "chunk count: $(ls chunks | wc -l)"

            - name: Push chunks to the transport branch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  cd chunks
                  git init -q .
                  git config user.name "voxelchat-bot"
                  git config user.email "voxelchat-bot@users.noreply.github.com"
                  git add -A
                  git commit -q -m "SmolLM2 1.7B Instruct Q4_K_M (chunked transport)" || true
                  git push --force \
                    "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                    "HEAD:refs/heads/model-cache" > /tmp/push.log 2>&1
                  status=$?
                  cat /tmp/push.log

                  # Report what happened through channels that can be read back
                  # without the Actions log viewer: an issue and a file.
                  python3 - <<'PY'
                  import base64, json, os, urllib.request

                  repo = os.environ["GITHUB_REPOSITORY"]
                  token = os.environ["GITHUB_TOKEN"]
                  api = f"https://api.github.com/repos/{repo}"
                  results = []

                  def request(method, url, payload=None):
                      data = json.dumps(payload).encode() if payload is not None else None
                      req = urllib.request.Request(
                          url, data=data, method=method,
                          headers={
                              "Authorization": f"token {token}",
                              "Accept": "application/vnd.github+json",
                              "Content-Type": "application/json",
                          },
                      )
                      try:
                          with urllib.request.urlopen(req) as response:
                              return response.status, response.read().decode()
                      except Exception as error:  # noqa: BLE001
                          body = getattr(error, "read", lambda: b"")()
                          return getattr(error, "code", "?"), body.decode(errors="replace")

                  log = open("/tmp/push.log", errors="replace").read()[-6000:]
                  report = "## transport log\n\n```\n" + log + "\n```\n"

                  results.append(request("POST", f"{api}/issues", {
                      "title": "VoxelChat transport report",
                      "body": report,
                  }))

                  status, body = request("GET", f"{api}/git/ref/heads/main")
                  sha = json.loads(body)["object"]["sha"] if status == 200 else None

                  if sha:
                      results.append(request("POST", f"{api}/git/refs", {
                          "ref": "refs/heads/model-cache-log",
                          "sha": sha,
                      }))

                  results.append(request("PUT", f"{api}/contents/model-transport-log.md", {
                      "message": "transport log",
                      "content": base64.b64encode(report.encode()).decode(),
                      "branch": "model-cache-log",
                  }))

                  print(json.dumps(results)[:2000])
                  PY

                  exit $status

            - name: Publish as a release asset
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
                      gh release create "$RELEASE_TAG" \
                          --title "SmolLM2 1.7B Instruct (Q4_K_M)" \
                          --notes "Model weights for VoxelChat. SHA-256: $MODEL_SHA256"
                  gh release upload "$RELEASE_TAG" "$MODEL_NAME" --clobber
                  exit 0

            - name: Summarise
              run: |
                  {
                    echo "### SmolLM2 1.7B is ready"
                    echo ""
                    echo "- file: \`$MODEL_NAME\`"
                    echo "- sha256: \`$MODEL_SHA256\`"
                    echo "- release asset: \`https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$MODEL_NAME\`"
                  } >> "$GITHUB_STEP_SUMMARY"
