name: Fetch SmolLM2 model

# The model weights (1.1 GB) do not live in git – GitHub refuses files above
# 100 MB. This workflow fetches SmolLM2 1.7B from Hugging Face on a GitHub
# runner, verifies the checksum and publishes it:
#
#   1. as a release asset  -> the URL VoxelChat downloads from, so the app
#      never has to talk to Hugging Face at runtime
#   2. as chunks on a `model-cache` branch (via the git database API) -> a
#      transport for sandboxes whose network only allows github.com
#
# The branch is a transport only; the release asset is the real home.

on:
    push:
        branches: [arena/108466d4-voxelchat]
        paths: [".github/workflows/fetch-model.yml"]
    workflow_dispatch: {}

permissions:
    contents: write

env:
    MODEL_NAME: smollm2-1.7b-instruct-q4_k_m.gguf
    MODEL_URL: https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF/resolve/2d4a76a30b4af41ecd395c35725ac11688d4cfe4/smollm2-1.7b-instruct-q4_k_m.gguf
    MODEL_SHA256: decd2598bc2c8ed08c19adc3c8fdd461ee19ed5708679d1c54ef54a5a30d4f33
    RELEASE_TAG: smollm2-1.7b-instruct-q4_k_m
    TRANSPORT_BRANCH: model-cache

jobs:
    fetch:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Download SmolLM2 1.7B Instruct (Q4_K_M)
              run: |
                  set -euo pipefail
                  echo "Downloading $MODEL_NAME ..."
                  curl -L --fail --retry 3 --retry-delay 5 -C - -o "$MODEL_NAME" "$MODEL_URL"
                  ls -lh "$MODEL_NAME"

            - name: Verify checksum
              run: |
                  set -euo pipefail
                  echo "$MODEL_SHA256  $MODEL_NAME" | sha256sum -c -

            - name: Publish as a release asset
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
                      gh release create "$RELEASE_TAG" \
                          --title "SmolLM2 1.7B Instruct (Q4_K_M)" \
                          --notes "Model weights for VoxelChat. SHA-256: $MODEL_SHA256" \
                          --target "$GITHUB_SHA"
                  gh release upload "$RELEASE_TAG" "$MODEL_NAME" --clobber
                  exit 0

            - name: Publish the transport branch through the git database API
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  rm -rf chunks
                  mkdir -p chunks
                  split -b 20M -d -a 3 "$MODEL_NAME" chunks/part-
                  ls -l chunks | tail -3

                  cat > /tmp/transport.py <<'PY'
                  import base64, json, os, pathlib, sys, urllib.request

                  repo = os.environ["GITHUB_REPOSITORY"]
                  token = os.environ["GITHUB_TOKEN"]
                  branch = os.environ["TRANSPORT_BRANCH"]
                  api = f"https://api.github.com/repos/{repo}"

                  def request(method, url, payload=None):
                      data = json.dumps(payload).encode() if payload is not None else None
                      req = urllib.request.Request(
                          url, data=data, method=method,
                          headers={
                              "Authorization": f"token {token}",
                              "Accept": "application/vnd.github+json",
                              "Content-Type": "application/json",
                          },
                      )
                      try:
                          with urllib.request.urlopen(req) as response:
                              return response.status, response.read().decode()
                      except Exception as error:  # noqa: BLE001
                          body = getattr(error, "read", lambda: b"")()
                          return getattr(error, "code", "?"), body.decode(errors="replace")

                  def need(method, url, payload=None):
                      status, body = request(method, url, payload)
                      if status not in (200, 201):
                          raise SystemExit(f"{method} {url} -> {status}: {body[:800]}")
                      return json.loads(body) if body else {}

                  status, body = request("GET", f"{api}/git/ref/heads/main")
                  base_sha = json.loads(body)["object"]["sha"]
                  print("base", base_sha)

                  entries = []
                  for chunk in sorted(pathlib.Path("chunks").iterdir()):
                      encoded = base64.b64encode(chunk.read_bytes()).decode()
                      blob = need("POST", f"{api}/git/blobs", {"content": encoded, "encoding": "base64"})
                      entries.append({
                          "path": f"model-cache/{chunk.name}",
                          "mode": "100644",
                          "type": "blob",
                          "sha": blob["sha"],
                      })
                      print(f"blob {chunk.name} -> {blob['sha']}", flush=True)

                  tree = need("POST", f"{api}/git/trees", {"base_tree": base_sha, "tree": entries})
                  print("tree", tree["sha"])
                  commit = need("POST", f"{api}/git/commits", {
                      "message": "SmolLM2 1.7B Instruct Q4_K_M (transport chunks)",
                      "tree": tree["sha"],
                      "parents": [base_sha],
                  })
                  print("commit", commit["sha"])
                  status, body = request("POST", f"{api}/git/refs", {
                      "ref": f"refs/heads/{branch}",
                      "sha": commit["sha"],
                  })
                  print("ref:", status, body[:300])
                  PY

                  python3 /tmp/transport.py > /tmp/transport.log 2>&1
                  status=$?
                  tail -n 30 /tmp/transport.log

                  if [ "$status" -ne 0 ]; then
                      notes=$(printf '## transport error\n\n```\n%s\n```\n' "$(tail -c 2500 /tmp/transport.log | tr -d '\r')")
                  else
                      notes=$(printf 'SmolLM2 1.7B Instruct (Q4_K_M) - SHA-256: %s\n\ntransport branch: %s\n' "$MODEL_SHA256" "$TRANSPORT_BRANCH")
                  fi
                  gh release edit "$RELEASE_TAG" --notes "$notes" || true
                  exit $status

            - name: Summarise
              run: |
                  {
                    echo "### SmolLM2 1.7B is ready"
                    echo ""
                    echo "- file: \`$MODEL_NAME\`"
                    echo "- sha256: \`$MODEL_SHA256\`"
                    echo "- release asset: \`https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$MODEL_NAME\`"
                    echo "- transport branch: \`$TRANSPORT_BRANCH\`"
                  } >> "$GITHUB_STEP_SUMMARY"
