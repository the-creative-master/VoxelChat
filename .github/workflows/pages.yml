name: Publish VoxelChat to GitHub Pages

# Publishes the browser-AI chat in pages/ to GitHub Pages.
# Visitors do NOTHING: they open the URL and chat — the AI runs
# entirely in their browser tab (llama.cpp via WebAssembly).
on:
  push:
    branches: [arena/166c7b09-voxelchat, main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # turn GitHub Pages on automatically — nobody clicks through Settings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
