<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1512">
<meta name="description" content="VoxelChat — a private AI chat that runs entirely on your computer. No keys, no cloud, nothing to install.">
<title>VoxelChat — Local AI Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="cube" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">Voxel<b>Chat</b></span>
      <span class="tag">100% local AI</span>
    </div>
    <div class="top-actions">
      <span class="status" id="status"><i class="dot busy"></i><span id="statusText">Starting…</span></span>
      <button class="ghost-btn" id="newChat" type="button">＋ New chat</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <span class="cube big" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Chat with AI.<br><span>Right on your machine.</span></h1>
      <p>No account. No API key. No cloud.<br>VoxelChat runs a real AI model locally — your chats never leave this computer.</p>
      <div class="suggestions">
        <button type="button" data-prompt="Hello! What can you help me with?">👋 Say hello</button>
        <button type="button" data-prompt="Explain how the internet works like I'm five.">💡 Explain something simply</button>
        <button type="button" data-prompt="Write a haiku about a robot learning to paint.">🎨 Write me a haiku</button>
        <button type="button" data-prompt="Give me 5 ideas for a fun weekend project.">🚀 Brainstorm ideas</button>
      </div>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
  </main>

  <footer class="composer-wrap">
    <div class="error-banner hidden" id="errorBanner">
      <span id="errorText"></span>
      <button type="button" id="retryBtn">Retry</button>
    </div>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Message VoxelChat…" aria-label="Message VoxelChat" maxlength="8000"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>↑</button>
      <button class="send stop hidden" id="stopBtn" type="button" aria-label="Stop generating">■</button>
    </form>
    <p class="hint"><span id="modelHint">Runs fully offline · Enter to send · Shift+Enter for a new line</span></p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
